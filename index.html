<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Morphism Digital Clock</title>
<style>
  :root{
    --ink:#1f2a44; --muted:#5b6788; --accent:#6c5ce7; --accent2:#00b894;
    --glass:rgba(255,255,255,.45); --glass-border:rgba(255,255,255,.75);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,#ffe9f3 0%,#e4f0ff 45%,#e3fbf1 100%);
    overflow-x:hidden;position:relative;
  }
  .blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.75;z-index:0;animation:float 14s ease-in-out infinite}
  .b1{width:340px;height:340px;background:#ffc2dd;top:-80px;left:-60px}
  .b2{width:380px;height:380px;background:#b9d7ff;bottom:-120px;right:-80px;animation-delay:-4s}
  .b3{width:260px;height:260px;background:#b8f2d8;top:40%;left:60%;animation-delay:-8s}
  @keyframes float{50%{transform:translate(30px,-40px) scale(1.1)}}

  .card{
    position:relative;z-index:1;width:min(560px,100%);padding:36px 32px 30px;border-radius:32px;
    background:var(--glass);border:1.5px solid var(--glass-border);
    -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
    box-shadow:0 30px 60px -20px rgba(80,90,160,.35),inset 0 1px 0 rgba(255,255,255,.9);
    text-align:center;
  }
  .badge{display:inline-block;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
    color:var(--accent);background:rgba(108,92,231,.12);padding:6px 14px;border-radius:999px;margin-bottom:18px}

  .analog{position:relative;width:200px;height:200px;margin:0 auto 22px;border-radius:50%;
    background:rgba(255,255,255,.55);border:1.5px solid var(--glass-border);
    box-shadow:0 14px 30px -12px rgba(80,90,160,.4),inset 0 0 25px rgba(255,255,255,.9)}
  .tick{position:absolute;left:50%;top:0;width:2px;height:100%;transform:translateX(-50%) rotate(calc(var(--i)*30deg))}
  .tick::before{content:"";position:absolute;top:8px;left:0;width:2px;height:10px;background:#9aa6c9;border-radius:2px}
  .hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:4px;transform:translateX(-50%) rotate(0deg)}
  .h-hour{width:5px;height:50px;background:var(--ink)}
  .h-min{width:4px;height:72px;background:var(--accent)}
  .h-sec{width:2px;height:84px;background:#ff5d8f;transition:transform .2s cubic-bezier(.4,2.3,.6,1)}
  .pivot{position:absolute;left:50%;top:50%;width:12px;height:12px;background:#ff5d8f;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}

  .time{font-size:clamp(2.6rem,12vw,4.6rem);font-weight:800;letter-spacing:.02em;font-variant-numeric:tabular-nums;
    background:linear-gradient(90deg,var(--accent),#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .time small{font-size:.32em;font-weight:700;margin-left:.3em;color:var(--accent2);-webkit-text-fill-color:var(--accent2)}
  .date{margin-top:8px;color:var(--muted);font-weight:600;letter-spacing:.04em}
  .zone{margin-top:4px;font-size:.85rem;color:#8a95b5}

  .controls{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  button{
    cursor:pointer;border:none;font:inherit;font-weight:700;padding:11px 22px;border-radius:14px;
    background:rgba(255,255,255,.7);color:var(--ink);border:1.5px solid var(--glass-border);
    box-shadow:0 8px 18px -10px rgba(80,90,160,.5);transition:transform .15s,box-shadow .15s,background .15s}
  button:hover{transform:translateY(-2px);box-shadow:0 12px 22px -10px rgba(80,90,160,.6)}
  button.on{background:linear-gradient(135deg,var(--accent),#8e7dff);color:#fff;border-color:transparent}
  @media (max-width:420px){.card{padding:28px 18px}.analog{width:170px;height:170px}.h-sec{height:70px}.h-min{height:60px}.h-hour{height:42px}}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}.h-sec{transition:none}}
</style>
</head>
<body>
<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
<main class="card" aria-label="Digital clock">
  <span class="badge">Live Time</span>
  <div class="analog" aria-hidden="true">
    <i class="tick" style="--i:0"></i><i class="tick" style="--i:1"></i><i class="tick" style="--i:2"></i>
    <i class="tick" style="--i:3"></i><i class="tick" style="--i:4"></i><i class="tick" style="--i:5"></i>
    <i class="tick" style="--i:6"></i><i class="tick" style="--i:7"></i><i class="tick" style="--i:8"></i>
    <i class="tick" style="--i:9"></i><i class="tick" style="--i:10"></i><i class="tick" style="--i:11"></i>
    <div class="hand h-hour" id="hHour"></div><div class="hand h-min" id="hMin"></div><div class="hand h-sec" id="hSec"></div>
    <span class="pivot"></span>
  </div>
  <div class="time" id="time" role="timer" aria-live="off">00:00:00</div>
  <div class="date" id="date"></div>
  <div class="zone" id="zone"></div>
  <div class="controls">
    <button id="fmt12" type="button">12h</button>
    <button id="fmt24" type="button">24h</button>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const timeEl = $('time'), dateEl = $('date'), zoneEl = $('zone');
  const hHour = $('hHour'), hMin = $('hMin'), hSec = $('hSec');
  let is24 = false;
  try { is24 = localStorage.getItem('clock24') === '1'; } catch (e) {}

  const pad = n => String(n).padStart(2, '0');

  function setFormat(v){
    is24 = v;
    $('fmt24').classList.toggle('on', v);
    $('fmt12').classList.toggle('on', !v);
    try { localStorage.setItem('clock24', v ? '1' : '0'); } catch (e) {}
    tick();
  }

  function tick(){
    const d = new Date();
    let h = d.getHours(), ap = '';
    if (!is24){ ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; }
    timeEl.innerHTML = pad(h) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + (ap ? '<small>' + ap + '</small>' : '');
    dateEl.textContent = d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    zoneEl.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

    const s = d.getSeconds(), m = d.getMinutes(), hr = d.getHours() % 12;
    hSec.style.transform = 'translateX(-50%) rotate(' + (s * 6) + 'deg)';
    hMin.style.transform = 'translateX(-50%) rotate(' + (m * 6 + s * 0.1) + 'deg)';
    hHour.style.transform = 'translateX(-50%) rotate(' + (hr * 30 + m * 0.5) + 'deg)';
  }

  $('fmt12').addEventListener('click', () => setFormat(false));
  $('fmt24').addEventListener('click', () => setFormat(true));
  setFormat(is24);
  setInterval(tick, 1000);
</script>
</body>
</html>
